# Add the actual unique app name after authenticated app creation.
primary_region = "iad"
[build]
  dockerfile = "Dockerfile"
[env]
  PORT = "8080"
  FRONTLINE_ALLOWED_HOSTS = "frontlineconsultant.com"
  FRONTLINE_DB_PATH = "/data/frontline.sqlite"
[[mounts]]
  source = "frontline_data"
  destination = "/data"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  [http_service.concurrency]
    type = "connections"
    soft_limit = 10
    hard_limit = 20
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
